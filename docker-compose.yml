services:
  backend:
    build: .
    environment:
      IESP_ENVIRONMENT: ${IESP_ENVIRONMENT:-development}
      IESP_AUTH_MODE: ${IESP_AUTH_MODE:-required}
      IESP_API_KEY: ${IESP_API_KEY:-change-me}
      IESP_ALLOWED_ORIGINS: ${IESP_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      IESP_DATABASE_PATH: /app/data/iesp.sqlite3
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
