name: IESP CI

on:
  push:
    branches: [main, development, furnished-design]
  pull_request:
    branches: [main, development, furnished-design]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt -r requirements-api.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile Python
        run: python -m compileall -q backend src scripts tests
      - name: Run full backend/security test suite
        run: pytest -q -ra

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt -r requirements-api.txt
          python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements-ml.txt -r requirements-api.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json is not present; using npm install until a lockfile is committed."
            npm install --no-audit --no-fund
          fi
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

  contract:
    name: API contract smoke check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Verify OpenAPI contract surface
        run: |
          python - <<'PY'
          from backend.app.main import app

          document = app.openapi()
          paths = document["paths"]
          required = {
              "/health", "/ready",
              "/api/v1/auth/register", "/api/v1/auth/login",
              "/api/v1/auth/logout", "/api/v1/auth/me",
              "/api/v1/analyze", "/api/v1/analyze/raw", "/api/v1/analyze/eml",
              "/api/v1/stats", "/api/v1/recent", "/api/v1/history",
              "/api/v1/analysis/{message_id}",
              "/api/v1/reports/summary", "/api/v1/reports/export",
          }
          missing = sorted(required - set(paths))
          assert not missing, f"Missing API paths: {missing}"

          def response_schema(path, status):
              operation = next(iter(paths[path].values()))
              response = operation["responses"][status]
              content = response.get("content", {})
              assert "application/json" in content, f"{path} {status} has no JSON response schema"
              return content["application/json"].get("schema", {})

          analyze_schema = response_schema("/api/v1/analyze", "200")
          assert analyze_schema.get("$ref") or analyze_schema.get("type") == "object", "Analyze response schema is missing"

          history_schema = response_schema("/api/v1/history", "200")
          assert history_schema.get("$ref") or history_schema.get("type") == "object", "History response schema is missing"

          error_refs = []
          for path, operations in paths.items():
              for operation in operations.values():
                  schema = operation.get("responses", {}).get("401", {}).get("content", {}).get("application/json", {}).get("schema")
                  if schema:
                      error_refs.append(schema)
          assert error_refs, "No documented 401 JSON error contract found"

          print("OpenAPI contract surface verified.")
          PY
