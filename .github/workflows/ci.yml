name: IESP CI

on:
  push:
    branches: [main, development, furnished-design]
  pull_request:
    branches: [main, development, furnished-design]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt -r requirements-api.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile Python
        run: python -m compileall -q backend src scripts tests
      - name: Run full backend/security test suite
        run: pytest -q -ra

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt -r requirements-api.txt
          python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements-ml.txt -r requirements-api.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository and Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Full-history secret scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --exit-code 2 --log-opts="--full-history --all" /repo

  contract:
    name: API contract validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Validate generated OpenAPI contract
        run: |
          python - <<'PY'
          from backend.app.main import app

          document = app.openapi()
          paths = document["paths"]
          components = document["components"]["schemas"]
          security_schemes = document["components"]["securitySchemes"]

          required_paths = {
              "/health": ("get", "200", "HealthResponse", False),
              "/ready": ("get", "200", "ReadyResponse", False),
              "/api/v1/auth/register": ("post", "201", "SessionResponse", False),
              "/api/v1/auth/login": ("post", "200", "SessionResponse", False),
              "/api/v1/auth/logout": ("post", "204", None, False),
              "/api/v1/auth/me": ("get", "200", "SessionResponse", True),
              "/api/v1/analyze": ("post", "200", "AnalysisResponse", True),
              "/api/v1/analyze/raw": ("post", "200", "AnalysisResponse", True),
              "/api/v1/analyze/eml": ("post", "200", "AnalysisResponse", True),
              "/api/v1/stats": ("get", "200", "StatsResponse", True),
              "/api/v1/recent": ("get", "200", "PaginatedAnalysisResponse", True),
              "/api/v1/history": ("get", "200", "PaginatedAnalysisResponse", True),
              "/api/v1/analysis/{message_id}": ("get", "200", "AnalysisResponse", True),
              "/api/v1/reports/summary": ("get", "200", "ReportSummaryResponse", True),
              "/api/v1/reports/export": ("get", "200", None, True),
          }

          def operation(path, method):
              assert path in paths, f"Missing API path: {path}"
              assert method in paths[path], f"Missing {method.upper()} operation for {path}"
              return paths[path][method]

          def ref_name(schema):
              ref = (schema or {}).get("$ref", "")
              return ref.rsplit("/", 1)[-1] if ref.startswith("#/components/schemas/") else None

          def response(op, status):
              assert status in op["responses"], f"Missing {status} response"
              return op["responses"][status]

          def assert_model(op, status, model_name):
              content = response(op, status).get("content", {})
              schema = content.get("application/json", {}).get("schema", {})
              assert ref_name(schema) == model_name, f"{status} response does not reference {model_name}"
              assert model_name in components, f"Missing component schema {model_name}"

          def assert_error(op, status):
              assert_model(op, status, "ErrorResponse")
              body = components["ErrorResponse"]
              assert set(body["required"]) >= {"error"}
              nested = body["properties"]["error"]
              assert ref_name(nested) == "ErrorBody"
              assert set(components["ErrorBody"]["required"]) >= {"code", "message", "request_id"}

          cookie_names = [
              name for name, scheme in security_schemes.items()
              if scheme.get("type") == "apiKey" and scheme.get("in") == "cookie"
          ]
          assert len(cookie_names) == 1, f"Expected exactly one cookie security scheme, got {cookie_names}"
          cookie_scheme = cookie_names[0]
          assert security_schemes[cookie_scheme]["name"] == "iesp_session"

          for path, (method, success_status, success_model, protected) in required_paths.items():
              op = operation(path, method)
              if success_model:
                  assert_model(op, success_status, success_model)
              if protected:
                  security = op.get("security", [])
                  assert {cookie_scheme: []} in security, f"{path} is missing session-cookie security"
                  assert_error(op, "401")

          ready = operation("/ready", "get")
          assert_model(ready, "503", "ReadyResponse")

          register = operation("/api/v1/auth/register", "post")
          assert_error(register, "409")
          assert_error(register, "422")

          login = operation("/api/v1/auth/login", "post")
          assert_error(login, "401")
          assert_error(login, "422")

          for path in ("/api/v1/analyze", "/api/v1/analyze/raw", "/api/v1/analyze/eml"):
              op = operation(path, "post")
              assert_error(op, "413")
              assert_error(op, "422")
              assert_error(op, "429")

          for path in ("/api/v1/history", "/api/v1/recent"):
              assert_error(operation(path, "get"), "422")

          assert_error(operation("/api/v1/analysis/{message_id}", "get"), "404")

          export = operation("/api/v1/reports/export", "get")
          content = response(export, "200").get("content", {})
          assert ref_name(content["application/json"]["schema"]) == "ReportExportResponse"
          assert content["text/csv"]["schema"].get("type") == "string"
          assert "ReportExportResponse" in components

          required_components = {
              "ErrorResponse", "ErrorBody", "SessionResponse", "WorkspaceResponse",
              "AnalysisResponse", "SecurityResponse", "PaginatedAnalysisResponse",
              "StatsResponse", "ReportSummaryResponse", "ReportExportResponse",
              "HealthResponse", "ReadyResponse",
          }
          assert required_components <= set(components), "One or more required component schemas are missing"

          analysis_required = set(components["AnalysisResponse"]["required"])
          assert {"message_id", "request_id", "analyzed_at", "email", "security", "model_info"} <= analysis_required

          security_required = set(components["SecurityResponse"]["required"])
          assert {"classification", "risk_score", "model_score_kind", "reasons"} <= security_required

          pagination_required = set(components["PaginatedAnalysisResponse"]["required"])
          assert {"items", "total", "page", "page_size", "pages"} <= pagination_required

          report_required = set(components["ReportSummaryResponse"]["required"])
          assert {"generated_at", "stats", "threat_distribution", "high_risk_items"} <= report_required

          export_required = set(components["ReportExportResponse"]["required"])
          assert {"generated_at", "items"} <= export_required

          print("Generated OpenAPI contract validated: routes, success schemas, error schemas, cookie authentication, pagination, analysis, and reports.")
          PY

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iesp
          POSTGRES_PASSWORD: iesp-ci-password
          POSTGRES_DB: iesp_test
        options: >-
          --health-cmd="pg_isready -U iesp -d iesp_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt -r requirements-ml.txt
      - name: Run real PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://iesp:iesp-ci-password@localhost:5432/iesp_test
        run: pytest -q tests/test_postgres_repository.py -ra

  docker:
    name: Docker image verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t iesp-backend:ci .
      - name: Build frontend image
        run: docker build -t iesp-frontend:ci ./frontend
