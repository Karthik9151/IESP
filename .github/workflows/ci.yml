name: IESP CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  backend-critical:
    name: Backend critical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-ml.txt -r requirements-api.txt

      - name: Compile Python
        run: python -m compileall -q backend src scripts tests

      - name: Run critical tests
        run: >
          pytest -q -ra
          backend/tests/test_api.py
          tests/security
          tests/test_dataset_pipeline.py
          tests/test_phishing_model.py
          tests/test_priority_model.py
          tests/test_model_bootstrap.py

  backend-regression:
    name: Backend regression tests (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-ml.txt -r requirements-api.txt

      - name: Run regression tests
        id: regression
        shell: bash
        run: |
          set +e
          pytest -q -ra             tests/integration             tests/test_m2_acceptance_runner.py             tests/test_repository.py             2>&1 | tee backend-regression.log
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          {
            echo "## Backend regression suite"
            echo
            if [ "$exit_code" -eq 0 ]; then
              echo "✅ Regression tests passed."
            else
              echo "⚠️ Regression tests failed, but this suite is intentionally non-blocking."
              echo
              echo "Exit code: $exit_code"
              echo "See the job log and uploaded `backend-regression-log` artifact for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-log
          path: backend-regression.log
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-ml.txt -r requirements-api.txt

      - name: Run pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-ml.txt -r requirements-api.txt

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        run: npm test

      - name: Production build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
