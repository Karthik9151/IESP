services:
  - type: web
    name: iesp-backend
    runtime: docker
    plan: free
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: IESP_ENVIRONMENT
        value: production
      - key: IESP_AUTH_MODE
        value: required
      - key: IESP_API_KEY
        sync: false
      - key: IESP_ALLOWED_ORIGINS
        fromService:
          name: iesp-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: IESP_MAX_REQUEST_BYTES
        value: "1048576"
      - key: IESP_SECURITY_CONFIG
        value: configs/security.yaml
      - key: IESP_PHISHING_ARTIFACT
        value: models/phishing/phishing_pipeline.joblib
      - key: IESP_PRIORITY_ARTIFACT
        value: models/priority/priority_pipeline.joblib
      - key: IESP_DATABASE_PATH
        value: /app/data/iesp.sqlite3
      - key: IESP_MODEL_OWNER
        value: Karthik9151
      - key: IESP_MODEL_REPO
        value: IESP
      - key: IESP_MODEL_RELEASE_TAG
        value: models-v1

  - type: web
    name: iesp-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: iesp-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'"
