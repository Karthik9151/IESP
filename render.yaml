services:
  - type: web
    name: iesp-backend
    runtime: docker
    plan: free
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: IESP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iesp-db
          property: connectionString
      - key: IESP_SESSION_SECURE
        value: "true"
      - key: IESP_SESSION_SAMESITE
        value: lax
      - key: IESP_ALLOWED_ORIGINS
        fromService:
          name: iesp-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: IESP_MAX_REQUEST_BYTES
        value: "2500000"
      - key: IESP_MAX_EMAIL_BYTES
        value: "2000000"
      - key: IESP_SECURITY_CONFIG
        value: configs/security.yaml
      - key: IESP_PHISHING_ARTIFACT
        value: models/phishing/phishing_pipeline.joblib
      - key: IESP_PRIORITY_ARTIFACT
        value: models/priority/priority_pipeline.joblib

  - type: pserv
    name: iesp-db
    plan: free
    runtime: postgres
    databaseName: iesp
    user: iesp

  - type: web
    name: iesp-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: >-
      cd frontend &&
      npm ci &&
      npm run build
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: iesp-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.onrender.com; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
