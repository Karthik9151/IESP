security:
  phishing:
    strong_score_threshold: 1.0
    suspicious_score_threshold: 0.0
    supporting_high_signals: 1
  suspicious:
    minimum_meaningful_signals: 1
  require_phishing_model: true
  url:
    max_length: 2048
    max_count: 50
    max_subdomains: 4
  attachment:
    max_count: 25
    max_size_bytes: 10485760
  parser:
    max_bytes: 2000000
